# Lokale Entwicklung/Test: baut beide Images aus dem Quellcode.
# Produktion läuft mit fertigen Images aus GHCR, gesteuert über das Repo vps-infra.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env

  web:
    build: ./web
    restart: unless-stopped
    # Nur auf Loopback veröffentlichen, nie 0.0.0.0 (Docker umgeht sonst jede Host-Firewall)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
