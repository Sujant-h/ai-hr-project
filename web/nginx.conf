server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression. Brotli is handled by Cloudflare at the edge, so we only
    # need solid gzip here for the origin -> Cloudflare hop and direct hits.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Fingerprinted build assets (Vite hashes every filename), so the content of
    # a given URL never changes — cache it for a year and skip revalidation.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # The HTML shell references the hashed assets, so it must never be cached or
    # a new deploy won't be picked up. Always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Single-page application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to the backend container
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        # Der Host-nginx setzt X-Forwarded-For auf die echte Besucher-IP; unverändert
        # weiterreichen, sonst hängt nginx hier die Docker-Gateway-IP an.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
